[project]
name = "tq-data-platform"
version = "0.1.0"
description = "Korean government welfare information aggregation service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "xmltodict>=0.13.0",
    "openai>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "psycopg2-binary>=2.9.0",
    "qdrant-client>=1.7.0",
    "sentence-transformers>=2.2.0",  # For BGE-M3 embeddings
    "torch>=2.0.0,<2.3.0",  # Required by sentence-transformers (macOS Intel compatible)
    "numpy>=1.24.0,<2.0.0",  # torch compatibility (numpy 2.x not supported yet)
]

[project.scripts]
setup-dev = "scripts.setup_dev:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.24.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
# Batch dependencies (GitHub Actions only)
batch = [
    "requests>=2.31.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "xmltodict>=0.13.0",
    "psycopg2-binary>=2.9.0",
    "qdrant-client>=1.7.0",
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0,<2.3.0",
    "numpy>=1.24.0,<2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Include app and shared directories for deployment builds
packages = ["app", "shared"]
exclude = [
    "batch/",
    "scripts/",
    "*.test.py",
    "test_*.py",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
